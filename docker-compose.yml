# Oru ERP Docker Compose

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: oru_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili-dev-master-key}
      MEILI_ENV: ${NODE_ENV:-development}
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:admin@postgres:5432/oru_erp
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
      - JWT_SECRET=JcMSILOrQE6jKwuNEORXAK1UFky8nWgU7EWVXCzNN0o=
      - VITE_JWT_SECRET=JcMSILOrQE6jKwuNEORXAK1UFky8nWgU7EWVXCzNN0o=
      - CORS_ORIGINS=https://oruerp.com,https://www.oruerp.com,http://localhost:5173,http://localhost:3000
      - NODE_ENV=production
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin123
      - S3_BUCKET=oru-uploads
      - S3_REGION=us-east-1
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-meili-dev-master-key}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      meilisearch:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oru-backend.rule=(Host(`oruerp.com`) || Host(`www.oruerp.com`) || Host(`get-oru.com`) || Host(`www.get-oru.com`)) && (PathPrefix(`/api`) || PathPrefix(`/database`))"
      - "traefik.http.routers.oru-backend.entrypoints=web,websecure"
      - "traefik.http.routers.oru-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.oru-backend.loadbalancer.server.port=3000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oru-frontend.rule=(Host(`oruerp.com`) || Host(`www.oruerp.com`) || Host(`get-oru.com`) || Host(`www.get-oru.com`))"
      - "traefik.http.routers.oru-frontend.entrypoints=web,websecure"
      - "traefik.http.routers.oru-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.oru-frontend.loadbalancer.server.port=80"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  meilisearch_data:
